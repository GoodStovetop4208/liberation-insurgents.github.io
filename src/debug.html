<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Liberation: Insurgents - Debug Console</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a2e;
            color: #00ff00;
            padding: 20px;
            margin: 0;
        }
        #console {
            background: #0f0f1e;
            border: 1px solid #00ff00;
            padding: 15px;
            height: 500px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .error { color: #ff4444; }
        .info { color: #00ff00; }
        .warn { color: #ffff00; }
        .success { color: #00cc00; }
        button {
            padding: 10px 20px;
            background: #00ff00;
            border: none;
            color: #000;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        button:hover {
            background: #00cc00;
        }
    </style>
</head>
<body>
    <h1>LIBERATION: INSURGENTS - Debug Console</h1>
    <div id="console"></div>
    <button onclick="loadGame()">Load Game</button>
    <button onclick="testMath()">Test Math</button>
    <button onclick="testRenderer()">Test Renderer</button>
    <button onclick="clearConsole()">Clear</button>
    <button onclick="window.location.href='index.html'">Play Game</button>

    <script>
        const consoleDiv = document.getElementById('console');

        function log(message, type = 'info') {
            const line = document.createElement('div');
            line.className = type;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            consoleDiv.appendChild(line);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function clearConsole() {
            consoleDiv.innerHTML = '';
        }

        // Override console methods
        const origLog = console.log;
        const origError = console.error;
        const origWarn = console.warn;

        console.log = (...args) => {
            log(args.join(' '), 'info');
            origLog(...args);
        };

        console.error = (...args) => {
            log(args.join(' '), 'error');
            origError(...args);
        };

        console.warn = (...args) => {
            log(args.join(' '), 'warn');
            origWarn(...args);
        };

        window.addEventListener('error', (e) => {
            log(`ERROR: ${e.message}`, 'error');
        });

        function loadGame() {
            log('Loading game files...', 'info');
            
            const files = [
                'utils/math.js',
                'renderer/webgl.js',
                'renderer/shader.js',
                'renderer/mesh.js',
                'renderer/material.js',
                'game/input.js',
                'game/player.js',
                'game/weapon.js',
                'game/enemy.js',
                'game/level.js',
                'game/ui.js',
                'main.js'
            ];

            let loaded = 0;
            files.forEach(file => {
                const script = document.createElement('script');
                script.src = file;
                script.onload = () => {
                    loaded++;
                    log(`Loaded ${file} (${loaded}/${files.length})`, 'success');
                    if (loaded === files.length) {
                        log('All files loaded successfully!', 'success');
                        testGame();
                    }
                };
                script.onerror = () => {
                    log(`Failed to load ${file}`, 'error');
                };
                document.body.appendChild(script);
            });
        }

        function testGame() {
            log('Game initialization test:', 'info');
            
            try {
                // Create a dummy canvas
                const canvas = document.createElement('canvas');
                canvas.width = 800;
                canvas.height = 600;
                
                log('Testing WebGL context...', 'info');
                const gl = canvas.getContext('webgl2');
                if (gl) {
                    log('WebGL 2.0 context created successfully', 'success');
                } else {
                    log('WebGL 2.0 not available', 'warn');
                    return;
                }

                log('Testing math classes...', 'info');
                const v1 = new Vec3(1, 2, 3);
                const v2 = new Vec3(4, 5, 6);
                const sum = v1.add(v2);
                log(`Vec3 test: (1,2,3) + (4,5,6) = (${sum.x},${sum.y},${sum.z})`, 'success');

                log('Testing Quaternion...', 'info');
                const q = Quaternion.fromEuler(0, 0, 0);
                log(`Quaternion.identity created: (${q.x},${q.y},${q.z},${q.w})`, 'success');

                log('Testing Transform...', 'info');
                const t = new Transform();
                log(`Transform created at (${t.position.x},${t.position.y},${t.position.z})`, 'success');

                log('Game initialization test completed successfully!', 'success');
            } catch (e) {
                log(`Test error: ${e.message}`, 'error');
                console.error(e);
            }
        }

        function testMath() {
            log('Running math tests...', 'info');
            try {
                const v = new Vec3(3, 4, 0);
                const len = v.length();
                log(`Vec3(3,4,0).length() = ${len}`, len === 5 ? 'success' : 'error');

                const norm = v.normalize();
                const normLen = norm.length();
                log(`Normalized length = ${normLen.toFixed(4)}`, Math.abs(normLen - 1) < 0.001 ? 'success' : 'error');

                const m1 = new Matrix4();
                const m2 = new Matrix4();
                const prod = m1.multiply(m2);
                log('Matrix multiplication works', 'success');
            } catch (e) {
                log(`Math test error: ${e.message}`, 'error');
            }
        }

        function testRenderer() {
            log('Testing renderer initialization...', 'info');
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 800;
                canvas.height = 600;
                
                log('Attempting WebGL 2.0 initialization...', 'info');
                const renderer = new WebGLRenderer(canvas);
                log('WebGLRenderer created successfully', 'success');

                log('Creating test mesh...', 'info');
                const mesh = Mesh.createBox(renderer.gl, 1, 1, 1);
                log('Box mesh created successfully', 'success');

                log('Creating camera...', 'info');
                const camera = new Camera();
                log(`Camera created at ${camera.position.x},${camera.position.y},${camera.position.z}`, 'success');

                log('Renderer test completed successfully!', 'success');
            } catch (e) {
                log(`Renderer test error: ${e.message}`, 'error');
                console.error(e);
            }
        }

        log('Debug console ready. Click "Load Game" to begin.', 'success');
    </script>
</body>
</html>
